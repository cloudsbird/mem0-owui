version: '3.8'

services:
  open-webui:
    image: 'ghcr.io/open-webui/open-webui:main'
    ports:
      - "3000:8080"
    volumes:
      - 'open-webui:/app/backend/data'
    environment:
      - SERVICE_FQDN_OPENWEBUI_8080
    depends_on:
      - pipelines
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1:8080'
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    ports:
      - "9099:9099"
    volumes:
      - pipelines:/app/pipelines
    environment:
      - PIPELINES_API_KEY=your_openrouter_api_key_here
      - LLM_API_KEY=your_openrouter_api_key_here
      - EMBEDDER_API_KEY=your_openrouter_api_key_here
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=your_neo4j_password
    depends_on:
      - qdrant
      - neo4j
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    restart: always
    container_name: qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/your_neo4j_password
      - NEO4J_PLUGINS=["graph-data-science"]
    restart: always
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "your_neo4j_password", "MATCH () RETURN count(*) limit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  open-webui:
  neo4j_data:
  pipelines:
  qdrant_data: